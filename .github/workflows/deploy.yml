name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Create archive
        run: |
          ARCHIVE="dist_$(date +%Y%m%d_%H%M%S).zip"
          zip -r "$ARCHIVE" dist/
          echo "ARCHIVE_PATH=$ARCHIVE" >> $GITHUB_ENV

      - name: Deploy to Hostinger
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          HOSTINGER_DOMAIN: lacasonasanmartin.cl
          ARCHIVE_PATH: ${{ env.ARCHIVE_PATH }}
        run: node scripts/deploy-hostinger.mjs
